<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1080" viewBox="0 0 1400 1080">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#334155"/></marker></defs>
<rect width="1400" height="1080" fill="#f8fafc"/>
<g font-family="Malgun Gothic, sans-serif" text-anchor="middle" fill="#0f172a">
<text x="700" y="45" font-size="30" font-weight="bold">소년 캐릭터 상태 머신</text>
<rect x="80" y="100" width="360" height="150" rx="24" fill="#e0e7ff" stroke="#6366f1" stroke-width="3"/>
<text x="260" y="143" font-size="29" font-weight="bold">수면 (SLEEP)</text>
<text x="260" y="181" font-size="19">누운 자세로 정지</text>
<text x="260" y="216" font-size="19">스페이스바 또는 방향키로 깨어남</text>
<rect x="960" y="100" width="360" height="150" rx="24" fill="#ffedd5" stroke="#f97316" stroke-width="3"/>
<text x="1140" y="143" font-size="29" font-weight="bold">달리기 (RUN)</text>
<text x="1140" y="181" font-size="19">방향키에 따라 초당 200픽셀 이동</text>
<text x="1140" y="216" font-size="19">100×100 크기 · 화면 경계에서 정지</text>
<rect x="510" y="380" width="380" height="160" rx="24" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
<text x="700" y="425" font-size="29" font-weight="bold">대기 (IDLE)</text>
<text x="700" y="465" font-size="19">대기 애니메이션 반복</text>
<text x="700" y="502" font-size="19">진입할 때마다 5초 타이머 시작</text>
<rect x="510" y="770" width="380" height="180" rx="24" fill="#fce7f3" stroke="#db2777" stroke-width="3"/>
<text x="700" y="812" font-size="28" font-weight="bold">자동 달리기 (AUTORUN)</text>
<text x="700" y="852" font-size="19">별도 AutoRun 클래스</text>
<text x="700" y="888" font-size="19">초당 400픽셀 · 300×300 크기</text>
<text x="700" y="924" font-size="19">조작 없이 이동하며 달리기 반복</text>
<g fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)">
<path d="M700 306 V368"/>
<path d="M540 380 L345 260"/>
<path d="M425 250 L605 370"/>
<path d="M855 380 L1045 260"/>
<path d="M965 250 L795 370"/>
<path d="M440 155 H948"/>
<path d="M610 540 V758"/>
<path d="M790 770 V552"/>
<path d="M890 850 H1140 V262"/>
<path d="M560 950 C510 1020 890 1020 840 960"/>
</g>
<circle cx="700" cy="295" r="11" fill="#334155"/>
<text x="750" y="327" font-size="18">시작</text>
<text x="340" y="328" font-size="19">대기 중 5초 경과</text>
<text x="535" y="278" font-size="19">스페이스바</text>
<text x="1080" y="330" font-size="19">좌우 방향키 누름</text>
<text x="865" y="283" font-size="19">방향키를 모두 뗌</text>
<text x="700" y="133" font-size="19">좌우 방향키 누름 → 해당 방향으로 달림</text>
<text x="495" y="645" font-size="20" font-weight="bold">A키 누름</text>
<text x="925" y="625" font-size="19">진입 후 5초 경과</text>
<text x="925" y="659" font-size="18">원래 크기로 복원</text>
<text x="1250" y="478" font-size="19">방향키 누름</text>
<text x="1250" y="515" font-size="18">자동 달리기 취소</text>
<text x="1250" y="550" font-size="18">해당 방향의 RUN</text>
<text x="700" y="1030" font-size="19">화면 끝에 닿으면 반대 방향으로 전환 (확대된 크기 기준)</text>
<text x="700" y="1065" font-size="17" fill="#475569">시간 측정: pico2d.get_time() · 화면 경계: pico2d.get_canvas_width()</text>
</g></svg>
